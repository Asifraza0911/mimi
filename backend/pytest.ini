[pytest]
# Pytest configuration for AI Waifu Cross-Platform System

# Register custom markers
markers =
    property_test: Property-based tests using hypothesis for universal correctness validation
    integration: Integration tests that test multiple components together
    unit: Unit tests for individual components

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum test coverage settings
addopts = 
    -v
    --strict-markers
    --tb=short

# Hypothesis settings
hypothesis_profile = default
