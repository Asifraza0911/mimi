<div class="affection-meter" role="region" aria-label="Affection meter">
  <!-- Heart Icon and Label -->
  <div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-2">
      <span class="text-xl sm:text-2xl" aria-hidden="true">{{ getHeartIcon() }}</span>
      <span class="text-xs sm:text-sm font-semibold text-gray-700">Affection</span>
    </div>
    <div class="text-right">
      <div class="text-base sm:text-lg font-bold" [ngClass]="getAffectionColor().replace('bg-', 'text-')">
        {{ affectionLevel }}
      </div>
      <div class="text-xs text-gray-600">{{ getStageDescription() }}</div>
    </div>
  </div>

  <!-- Progress Bar Container -->
  <div class="relative w-full h-6 bg-gray-200 rounded-full overflow-hidden shadow-inner" role="progressbar" [attr.aria-valuenow]="affectionLevel" aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="'Affection level: ' + affectionLevel + ' percent'">
    <!-- Progress Bar Fill with Animation -->
    <div 
      class="h-full rounded-full transition-all duration-700 ease-out"
      [ngClass]="getAffectionColor()"
      [style.width.%]="affectionLevel"
    >
      <!-- Shine Effect -->
      <div class="h-full w-full bg-gradient-to-r from-transparent via-white to-transparent opacity-30"></div>
    </div>
    
    <!-- Percentage Text Overlay -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <span class="text-xs font-bold text-gray-700 drop-shadow-sm" aria-hidden="true">
        {{ affectionLevel }}%
      </span>
    </div>
  </div>

  <!-- Stage Markers (Optional Visual Guide) -->
  <div class="flex justify-between mt-1 px-1" aria-hidden="true">
    <span class="text-xs text-gray-400">0</span>
    <span class="text-xs text-gray-400">20</span>
    <span class="text-xs text-gray-400">50</span>
    <span class="text-xs text-gray-400">80</span>
    <span class="text-xs text-gray-400">100</span>
  </div>
</div>
